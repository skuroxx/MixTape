plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

// Bump to the latest release: https://github.com/TeamNewPipe/NewPipeExtractor/releases
def extractorVersion = findProperty('extractorVersion') ?: 'v0.24.8'

dependencies {
    implementation "com.github.TeamNewPipe:NewPipeExtractor:${extractorVersion}"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

application {
    mainClass = 'mixtape.Main'
}

shadowJar {
    archiveFileName = 'app.jar'
}
