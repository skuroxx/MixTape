<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synced lyrics demo</title>
<link rel="stylesheet" href="amlyrics.css">
<style>
  :root { color-scheme: dark; --bg: #150f1f; --amber: #e8893c; --rose: #b8456b; --indigo: #2b2370; --ink: #fff; --mut: rgba(255,255,255,.62); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 500 15px/1.4 "SF Pro Text", "Google Sans", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .bg i { position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 38s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { background: var(--amber); left: -45vmax; top: -50vmax; }
  .bg i:nth-child(2) { background: var(--rose); right: -50vmax; top: 10vmax; animation-duration: 47s; animation-delay: -9s; opacity: .45; }
  .bg i:nth-child(3) { background: var(--indigo); left: -20vmax; bottom: -65vmax; animation-duration: 55s; opacity: .8; }
  .bg::after { content: ""; position: absolute; inset: 0; background: rgba(10,6,16,.46); }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) rotate(40deg); } }
  @media (prefers-reduced-motion: reduce) { .bg i { animation: none; } }

  .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
  header { padding: calc(env(safe-area-inset-top) + 18px) 24px 0; }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: 0; }
  header p { margin: 2px 0 0; color: var(--mut); font-size: .88rem; }
  #lyrics { flex: 1; min-height: 0; }

  .dock { margin: 0 14px calc(env(safe-area-inset-bottom) + 14px); padding: 14px 16px 12px; border-radius: 26px; background: rgba(255,255,255,.11);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); border: 1px solid rgba(255,255,255,.18); }
  .row { display: flex; align-items: center; gap: 12px; }
  .time { font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--mut); min-width: 38px; }
  .time:last-child { text-align: right; }
  .seek { position: relative; flex: 1; height: 28px; cursor: pointer; touch-action: none; outline: none; }
  .seek::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); }
  .seek b { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: #fff; width: calc(var(--p, 0) * 1%); }
  .seek:focus-visible { box-shadow: 0 0 0 3px rgba(255,255,255,.6); border-radius: 8px; }
  .play { width: 54px; height: 54px; border-radius: 50%; border: 0; background: #fff; color: #1a1020; display: grid; place-items: center; cursor: pointer; }
  .play svg { width: 24px; height: 24px; fill: currentColor; }
  .play:focus-visible, .chip:focus-visible, select:focus-visible { outline: 3px solid rgba(255,255,255,.7); outline-offset: 2px; }
  .opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .chip, select { font: 600 .8rem/1 inherit; color: var(--ink); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 8px 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: #fff; color: #1a1020; border-color: #fff; }
  select option { color: #111; }
  .fps { margin-left: auto; font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--mut); }
  .json { display: none; margin-top: 12px; }
  .json.open { display: block; }
  .json textarea { width: 100%; height: 150px; resize: vertical; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 10px; }
  .json .row { margin-top: 8px; gap: 8px; }
  .json a { color: #fff; font-size: .8rem; }
  .msg { color: #ffb4a8; font-size: .8rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
  <header><h1 id="title">Paper Lanterns</h1><p id="artist">Mira &amp; Joss (sample)</p></header>
  <div id="lyrics" aria-label="Lyrics"></div>

  <div class="dock">
    <div class="row">
      <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="play-ic"><path d="M8 5v14l11-7z"/></svg></button>
      <span class="time" id="cur">0:00</span>
      <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="74" aria-valuenow="0"><b></b></div>
      <span class="time" id="dur">1:14</span>
    </div>
    <div class="opts">
      <select id="rate" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button class="chip" id="coarse" aria-pressed="false" title="Feed the lyrics a position only 4 times a second, like a YouTube iframe, and let the clock interpolate">4 Hz position feed</button>
      <button class="chip" id="lite" aria-pressed="false" title="Turns off zoom, pop, blur and letter motion">Lite effects</button>
      <button class="chip" id="jsonbtn" aria-pressed="false">Use your JSON</button>
      <span class="fps" id="fps" aria-live="off">60 fps</span>
    </div>
    <div class="json" id="json">
      <textarea id="ta" spellcheck="false" aria-label="Lyrics JSON"></textarea>
      <div class="row"><button class="chip" id="apply">Apply</button><a href="sample-lyrics.json" download>Download sample JSON</a><span class="msg" id="msg" role="status"></span></div>
    </div>
  </div>
</div>
<span class="sr">No audio plays in this demo: a silent clock stands in for the player.</span>

<script src="amlyrics.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const sample = JSON.parse($("#sample").textContent);
  let duration = sample.meta.duration || 74, T = 0, playing = false, rate = 1, last = 0, coarse = false;

  const lyr = new AMLyrics($("#lyrics"), { getTime: () => T, onSeek: (t) => seek(t) });
  const load = (data) => {
    const m = data.meta || {};
    $("#title").textContent = m.title || "Untitled"; $("#artist").textContent = m.artist || "";
    const lines = data.lines || data;
    const end = Math.max(0, ...lines.map((l) => Math.max(l.e || 0, l.t || 0, ...((l.words || []).map((w) => w.e || 0)))));
    duration = m.duration || Math.ceil(end + 4); $("#dur").textContent = fmt(duration); $("#seek").setAttribute("aria-valuemax", duration);
    T = 0; lyr.load(data); render();
  };
  const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  function render() {
    $("#cur").textContent = fmt(T); $("#seek").style.setProperty("--p", (T / duration) * 100); $("#seek").setAttribute("aria-valuenow", Math.round(T));
  }
  function seek(t) { T = Math.max(0, Math.min(duration, t)); lyr.clock.sync(T, playing, rate); render(); }

  /* the "audio": a silent transport on the monotonic clock */
  function tick(ts) {
    requestAnimationFrame(tick);
    if (playing) { T += ((ts - last) / 1000) * rate; if (T >= duration) { T = duration; setPlaying(false); } render(); }
    last = ts; $("#fps").textContent = Math.round(lyr.fps) + " fps";
  }
  function setPlaying(p) {
    if (p && T >= duration) T = 0;
    playing = p; lyr.clock.sync(T, playing, rate);
    $("#play-ic").innerHTML = p ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; $("#play").setAttribute("aria-label", p ? "Pause" : "Play");
  }
  $("#play").onclick = () => setPlaying(!playing);
  $("#rate").onchange = (e) => { rate = +e.target.value; lyr.clock.sync(T, playing, rate); };

  /* scrubber: pointer drag + arrow keys */
  const seekEl = $("#seek"); let drag = false;
  const at = (e) => { const r = seekEl.getBoundingClientRect(); seek(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * duration); };
  seekEl.addEventListener("pointerdown", (e) => { drag = true; seekEl.setPointerCapture(e.pointerId); at(e); });
  seekEl.addEventListener("pointermove", (e) => drag && at(e));
  seekEl.addEventListener("pointerup", () => (drag = false));
  seekEl.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") seek(T + 5); else if (e.key === "ArrowLeft") seek(T - 5); else return; e.preventDefault(); });
  addEventListener("keydown", (e) => { if (e.code === "Space" && !/TEXTAREA|SELECT|BUTTON/.test(e.target.tagName) && !e.target.classList.contains("am-line") && !e.target.classList.contains("am-break")) { e.preventDefault(); setPlaying(!playing); } });

  /* position feed: either exact (getTime) or 4 Hz pushes that the clock interpolates */
  let feed = 0;
  $("#coarse").onclick = (e) => {
    coarse = !coarse; e.currentTarget.setAttribute("aria-pressed", coarse);
    clearInterval(feed);
    if (coarse) { lyr.getTime = null; lyr.clock.sync(T, playing, rate); feed = setInterval(() => lyr.clock.sync(T, playing, rate), 250); }
    else lyr.getTime = () => T;
  };
  $("#lite").onclick = (e) => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); lyr.setFx(on ? "lite" : "full"); };
  $("#jsonbtn").onclick = (e) => { const on = $("#json").classList.toggle("open"); e.currentTarget.setAttribute("aria-pressed", on); if (on && !$("#ta").value) $("#ta").value = JSON.stringify(sample, null, 1); };
  $("#apply").onclick = () => { try { load(JSON.parse($("#ta").value)); $("#msg").textContent = ""; setPlaying(false); } catch (err) { $("#msg").textContent = "That JSON didn't parse: " + err.message; } };

  load(sample); lyr.start(); requestAnimationFrame((t) => { last = t; tick(t); });
})();
</script>
</body>
</html>
