name = "mixtape-stream"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]   # @distube/ytdl-core uses node:util / stream / crypto

[vars]
# Comma-separated list of sites allowed to play audio from this Worker (CORS). Use * while testing.
ALLOWED_ORIGINS = "*"

# Secret (do NOT put it here):   npx wrangler secret put STREAM_SECRET
# Use the same value in Vercel as STREAM_SECRET.

# import.meta.url does not exist in Workers; @distube/ytdl-core reads it at load time (to find its helper threads, which we never use).
[define]
"import.meta.url" = "\"file:///ytdl/index.js\""
